global:
  scrape_interval: 5s

rule_files:
  - "prometheus_rules.yml"

scrape_configs:
  - job_name: "fastapi"
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"
