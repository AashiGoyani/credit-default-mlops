global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'aashigoyani18@gmail.com'
  smtp_auth_username: 'aashigoyani18@gmail.com'
  smtp_auth_password: 'mbys kpcy yxaf sbkp'   # Gmail App Password
  smtp_require_tls: true

route:
  receiver: 'email-alert'
  group_by: ['alertname']          # Group alerts by alert name
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 2h
  routes:
    - match:
        severity: critical
      receiver: 'email-alert'
    - match:
        severity: warning
      receiver: 'email-alert'
    - match:
        severity: info         # handle your test alert
      receiver: 'email-alert'

receivers:
  - name: 'email-alert'
    email_configs:
      - to: 'aashigoyani18@gmail.com'
        send_resolved: true
        headers:
          subject: "[{{ .CommonLabels.severity | toUpper }}] ⚡ {{ .CommonAnnotations.summary }}"
        html: |
          <b>🚨 Alert Triggered!</b><br><br>
          <b>Summary:</b> {{ .CommonAnnotations.summary }}<br>
          <b>Description:</b> {{ .CommonAnnotations.description }}<br>
          <b>Status:</b> {{ .Status | toUpper }}<br>
          <b>Labels:</b> {{ .CommonLabels }}<br><br>
          <i>Time:</i> {{ .ExternalURL }}<br>
